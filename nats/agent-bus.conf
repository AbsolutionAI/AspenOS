# Starship OS NATS Server Configuration
# Agent Communication Bus

port: 4222
host: "127.0.0.1"
http_port: 8222

jetstream {
  store_dir: "/var/lib/starship/nats"
  max_memory_store: 256MB
  max_file_store: 1GB
}

# Authorization disabled for development
# authorization {
#   token: "agnetic-dev-token"
# }

# Rate limiting + connection caps (ASP-375 F-011)
# Per-connection hardening so a rogue/broken local client cannot exhaust
# descriptors, memory, or logs. max_pending stays >= max_payload (8MB).
max_payload: 8MB
max_connections: 100
max_pending: 16MB
max_control_line: 4KB
max_subscriptions: 512
max_closed_clients: 4096
max_traced_msg_len: 512
write_deadline: 5s
ping_interval: 30s
ping_max: 3
connect_error_reports: 3600
reconnect_error_reports: 4
debug: false
trace: false
