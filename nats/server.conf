# Starship OS — LEGACY NATS conf (H-017 / ASP-365). Placeholders only.
# ---------------------------------------------------------------------------
# Not used by agnetic-nats.service, which runs /etc/starship/nats/active.conf
# (agent-bus.conf by default, or the generated fleet-accounts / fleet-bus conf).
# build-deb.sh / install-daemon.sh still copy this file for backward
# compatibility, so it must never carry real credentials.
#
# Generate real credentials with scripts/gen-nats-accounts.sh (accounts mode)
# or let firstboot substitute __STARSHIP_NATS_TOKEN__ (token mode).
# Literal secrets that previously lived here are in public git history and
# must be treated as compromised — never reuse them.
# ---------------------------------------------------------------------------

port: 4222
host: "127.0.0.1"

jetstream: {
  store_dir: "/tmp/nats-jetstream"
  max_memory_store: 1073741824
  max_file_store: 10737418240
}

authorization: {
  token: "__STARSHIP_NATS_TOKEN__"
  timeout: 5.0

  permissions: {
    pkg_agnetic: {
      publish: {
        allow: ["agnetic.>"]
      }
      subscribe: {
        allow: ["agnetic.>"]
      }
    }
    pkg_telemetry: {
      publish: {
        allow: ["agnetic.telemetry.>"]
      }
    }
  }
}

accounts: {
  SYS: {
    users: [
      {user: "admin", password: "__SYS_PASS__"}
    ]
  }
  STARS: {
    users: [
      {user: "agnetic", password: "__AGNETIC_PASS__"}
    ]
  }
}
