# LEGACY single-node template (H-017 / ASP-365).
# DO NOT put live secrets in this file. Placeholders only.
#
# Production / ops path (default since H-001):
#   bash scripts/gen-nats-accounts.sh --out /etc/starship/nats
#   active.conf → fleet-accounts.conf (+ optional TLS via gen-nats-tls.sh)
#
# Trusted-LAN token bus:
#   firstboot materializes fleet-bus.conf with __STARSHIP_NATS_TOKEN__
#
# If you still need this legacy shape for a lab host, copy to
# /etc/starship/nats/server.active.conf and substitute placeholders from
# env (never commit the substituted file):
#   STARSHIP_NATS_TOKEN, NATS_ADMIN_PASS, NATS_USER_PASS
#
# Installers may copy this template under /etc/starship/nats/ but must NOT
# set active.conf → server.conf (active stays fleet-accounts or fleet-bus).

port: 4222
host: "127.0.0.1"

jetstream: {
  store_dir: "/tmp/nats-jetstream"
  max_memory_store: 1073741824
  max_file_store: 10737418240
}

authorization: {
  token: "__STARSHIP_NATS_TOKEN__"
  timeout: 5.0

  permissions: {
    pkg_agnetic: {
      publish: {
        allow: ["agnetic.>"]
      }
      subscribe: {
        allow: ["agnetic.>"]
      }
    }
    pkg_telemetry: {
      publish: {
        allow: ["agnetic.telemetry.>"]
      }
    }
  }
}

accounts: {
  SYS: {
    users: [
      {user: "admin", password: "__NATS_ADMIN_PASS__"}
    ]
  }
  STARS: {
    users: [
      {user: "agnetic", password: "__NATS_USER_PASS__"}
    ]
  }
}
