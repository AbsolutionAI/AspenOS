# Starship OS — DEPRECATED legacy NATS conf (H-017 / ASP-365)
# ---------------------------------------------------------------------------
# DO NOT use this file for production or lab deployments.
# DO NOT commit live tokens or passwords here.
#
# Canonical path (H-001 / H-006):
#   1. Template:  nats/fleet-accounts.conf.tmpl
#   2. Generate:  bash scripts/gen-nats-accounts.sh --out /etc/starship/nats
#                 (or --out nats for local dev; nats/creds/ is gitignored)
#   3. Active:    /etc/starship/nats/active.conf → fleet-accounts.conf
#   4. Clients:   source /etc/starship/nats.env  (or nats/nats.env)
#   5. Firstboot: scripts/starship-firstboot.sh (_enable_accounts_bus)
#
# Token-mode opt-in (trusted LAN only): nats/fleet-bus.conf with
#   __STARSHIP_NATS_TOKEN__ substituted by firstboot — never commit the token.
#
# Historical lab secrets that once lived in this file are REVOKED and must
# never be reused (see docs/SECURITY.md § NATS secret rotation).
# ---------------------------------------------------------------------------

port: 4222
host: "[IP_ADDRESS]"

jetstream {
  store_dir: "/tmp/nats-jetstream"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Placeholders only — materialize via scripts/gen-nats-accounts.sh (preferred)
# or substitute before start. nats-server will not accept these literal markers
# as production credentials; that is intentional.
authorization {
  token: "__STARSHIP_NATS_TOKEN__"
  timeout: 5.0
}

system_account: SYS

accounts {
  SYS {
    users: [
      {user: "sys", password: "__SYS_PASS__"}
    ]
  }
  STARS {
    jetstream: enabled
    users: [
      {user: "ops", password: "__OPS_PASS__"}
    ]
  }
}
