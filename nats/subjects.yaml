# Starship OS NATS Subject Topology
# Dual-prefix: starship.* (primary) + agnetic.* (legacy Alpha 2.0)

prefixes:
  primary: starship
  legacy: agnetic

subjects:
  agent:
    proxy:
      command: "starship.agent.proxy.command.*"
      event: "starship.agent.proxy.event.*"
      status: "starship.agent.proxy.status"
      legacy:
        command: "agnetic.agent.proxy.command.*"
        event: "agnetic.agent.proxy.event.*"
        status: "agnetic.agent.proxy.status"
    romi:
      command: "starship.agent.romi.command.*"
      event: "starship.agent.romi.event.*"
      status: "starship.agent.romi.status"
      legacy:
        command: "agnetic.agent.romi.command.*"
        event: "agnetic.agent.romi.event.*"
        status: "agnetic.agent.romi.status"
    ergo:
      command: "starship.agent.ergo.command.*"
      event: "starship.agent.ergo.event.*"
      status: "starship.agent.ergo.status"
      legacy:
        command: "agnetic.agent.ergo.command.*"
        event: "agnetic.agent.ergo.event.*"
        status: "agnetic.agent.ergo.status"
  telemetry:
    root: "starship.telemetry"
    cpu: "starship.telemetry.cpu"
    mem: "starship.telemetry.mem"
    disk: "starship.telemetry.disk"
    net: "starship.telemetry.net"
    legacy:
      root: "agnetic.telemetry"
      cpu: "agnetic.telemetry.cpu"
      mem: "agnetic.telemetry.mem"
      disk: "agnetic.telemetry.disk"
      net: "agnetic.telemetry.net"
  workflow: "starship.workflow.>"
  skill: "starship.skill.>"
  fleet:
    register: "starship.fleet.register"
    heartbeat: "starship.fleet.heartbeat"
    status: "starship.fleet.status"
    ops_status: "starship.fleet.ops.status"
    exercise: "starship.fleet.exercise"
    legacy:
      register: "agnetic.fleet.register"
      heartbeat: "agnetic.fleet.heartbeat"
      status: "agnetic.fleet.status"
      ops_status: "agnetic.fleet.ops.status"
      exercise: "agnetic.fleet.exercise"

# Command types (used as wildcard *)
commands:
  - ping
  - status
  - report
  - configure
  - execute
  - stop

# Event types
events:
  - started
  - stopped
  - error
  - warning
  - completed
  - heartbeat

# aspen.* namespace (ADR-0007 / ADR-0003, H-013).
# New work uses aspen.*; dual-publish starship.*/agnetic.* only for Alpha clients.
aspen:
  sentinel:
    audit_event: "aspen.sentinel.audit.event"
    fleet_overview: "aspen.sentinel.fleet.overview"
    osint_ingest: "aspen.sentinel.osint.ingest"
    incident_channel: "aspen.sentinel.incident.channel"
  authz:
    gate_request: "aspen.authz.gate.request"
    gate_decision: "aspen.authz.gate.decision"
    capability_grant: "aspen.authz.capability.grant"
  fleet:
    node_register: "aspen.fleet.node.register"
    node_heartbeat: "aspen.fleet.node.heartbeat"
    ops_status: "aspen.fleet.ops.status"
    mission: "aspen.fleet.mission.>"
  edge:
    heartbeat: "aspen.edge.<node_id>.heartbeat"
    propose_act: "aspen.edge.<node_id>.propose_act"
    authorize: "aspen.edge.<node_id>.authorize"
    command: "aspen.edge.<node_id>.command"
  safety:
    estop: "aspen.safety.estop"
    authorize_clear: "aspen.safety.authorize_clear"
    clear: "aspen.safety.clear"
