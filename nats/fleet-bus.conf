# Starship OS — multi-node fleet NATS bus (ops profile)
# Installed to /etc/starship/nats/fleet-bus.conf
# Active when firstboot sets active.conf → fleet-bus.conf
#
# Token: firstboot writes STARSHIP_NATS_TOKEN into this file and /etc/starship/nats.env
# Dual-prefix: starship.* primary + agnetic.* legacy.

port: 4222
host: "0.0.0.0"
http_port: 8222

jetstream {
  store_dir: "/var/lib/starship/nats"
  max_memory_store: 512MB
  max_file_store: 4GB
}

# Rate limiting + connection caps (ASP-375 F-011)
# Per-connection hardening + auth-failure limits so a flooded or failed-auth
# client cannot exhaust descriptors, handshake slots, memory, or logs.
# max_pending stays >= max_payload (8MB).
max_payload: 8MB
max_connections: 256
max_pending: 16MB
max_control_line: 4KB
max_subscriptions: 512
max_closed_clients: 4096
max_traced_msg_len: 512
write_deadline: 5s
ping_interval: 30s
ping_max: 3
connect_error_reports: 3600
reconnect_error_reports: 4
debug: false
trace: false

# Shared fleet token — firstboot replaces __STARSHIP_NATS_TOKEN__
# timeout caps the auth handshake: unauthenticated connections are dropped at
# 2s (default) instead of holding a slot open for 5s.
authorization {
  token: "__STARSHIP_NATS_TOKEN__"
  timeout: 2.0
}

# Cluster routes (ops multi-node — set STARSHIP_NATS_ROUTES in firstboot.env)
# cluster {
