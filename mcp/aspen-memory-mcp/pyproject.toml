[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aspen-memory-mcp"
version = "0.1.0"
description = "BEL-154 MCP server exposing the Starship OS memory layer (Component 4.2)"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=1.0",
    "aspen-memory>=0.1.0",
]

[project.scripts]
aspen-memory-mcp = "aspen_memory_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]
