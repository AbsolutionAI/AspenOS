[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aspen-memory"
version = "0.1.0"
description = "BEL-154 access-layer Python library (MemoryClient) for the Starship OS memory layer"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["."]
