name: Starship OS CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check agents/ dashboard/ services/ || true
      - run: ruff format --check agents/ dashboard/ services/ || true

  security-devonly-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dev-only package isolation (H-019)
        run: bash scripts/check-no-devonly-in-prod.sh

  verify-package-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gnupg2 + pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gnupg2
          pip install pytest pyyaml
      - name: F-014 signed-package gate (unsigned/tampered fixtures must fail)
        run: python -m pytest tests/test_package_signatures.py -q

  security-model-digests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install digest-gate deps
        run: pip install pyyaml pytest aiohttp
      - name: F-013 pins validate offline (structural, strict)
        run: STARSHIP_STRICT_DIGESTS=1 STARSHIP_OFFLINE=1 python3 scripts/resolve-model-digests.py --check --offline
      - name: F-013 digest gate fixtures (tamper/mismatch must fail)
        run: python -m pytest tests/test_model_digests.py -q

  # Required check (ASP-730). Runs tests/ wholesale so a red full Python suite
  # is visible on the PR instead of only in nightly section 13 and QA preflight,
  # where a non-zero exit gets misread as a regression in the change under review.
  # Deliberately no continue-on-error / always(): the only way past this gate is a
  # deliberate settings change, not an ignore-click.
  python-test-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install suite deps
        # Only what the suite requires. The optional deps (aiohttp, mcp.server,
        # nats-py, the out-of-repo Hermes holographic plugin) stay uninstalled so
        # their documented skips keep skipping and this gate's baseline matches
        # what QA preflight sees.
        run: pip install pytest pytest-asyncio pyyaml
      - name: Record interpreter
        run: python -VV
      # -rs so the four optional-dependency skips print their reasons in the log
      # instead of being an unexplained "s" in the progress output.
      - name: Full Python suite (tests/)
        run: python -m pytest tests/ -v --tb=short -rs

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev gcc pkg-config
          pip install pyyaml nats-py
      - name: Build CLI
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd starshipctl && go build -o starshipctl .
      - name: Checkout pinned sibling repos for fleet-bus smoke
        run: |
          RRM_COMMIT=$(python3 -c "import json;print(json.load(open('third_party/pins.json'))['components']['aspen-edge-rrm']['commit'])")
          SWARM_COMMIT=$(python3 -c "import json;print(json.load(open('third_party/pins.json'))['components']['aspen-swarm-manager']['commit'])")
          git clone -q --filter=blob:none "$(python3 -c "import json;print(json.load(open('third_party/pins.json'))['components']['aspen-edge-rrm']['github'])")" ../aspen-edge-rrm
          git -C ../aspen-edge-rrm checkout -q "$RRM_COMMIT"
          git clone -q --filter=blob:none "$(python3 -c "import json;print(json.load(open('third_party/pins.json'))['components']['aspen-swarm-manager']['github'])")" ../aspen-swarm-manager
          git -C ../aspen-swarm-manager checkout -q "$SWARM_COMMIT"
      - name: Smoke
        env:
          PATH: /usr/local/go/bin:/home/runner/go/bin:/usr/local/bin:/usr/bin:/bin
        run: |
          export PATH="$(go env GOPATH)/bin:$(pwd)/starshipctl:$PATH"
          # install nats-server for accounts conf -t
          curl -sL https://github.com/nats-io/nats-server/releases/download/v2.14.5/nats-server-v2.14.5-linux-amd64.tar.gz | tar xz
          sudo cp nats-server-v2.14.5-linux-amd64/nats-server /usr/local/bin/
          # optional nkeys
          go install github.com/nats-io/nkeys/nk@latest || true
          export PATH="$(go env GOPATH)/bin:$PATH"
          bash scripts/smoke-test.sh
          bash scripts/iso-firstboot-smoke.sh

  build-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: cd starshipctl && go build -o starshipctl .
      - run: ./starshipctl/starshipctl version

  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - run: ~/.cargo/bin/cargo build --release --manifest-path agent/Cargo.toml

  build-c11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev gcc pkg-config
      - run: make -C src/c/sandbox_spike all test
      - run: ./src/c/sandbox_spike/sandbox_run --help >/dev/null
