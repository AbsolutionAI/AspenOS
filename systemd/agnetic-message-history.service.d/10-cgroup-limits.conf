[Service]
# ── Message history — NATS JetStream consumer (H-012) ─────────
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes
IOAccounting=yes

# CPU: JetStream consumer processes message streams, moderate CPU
CPUQuota=50%
CPUWeight=100

# Memory: message buffering; hard cap at 512MiB
MemoryMax=512M
MemoryHigh=384M

# PID: Python + JetStream subscription pool
TasksMax=128
