[Service]
# ── Health checker — periodic agent connectivity checks (H-012) ─
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes

# CPU: runs briefly every 30s; minimal allocation
CPUQuota=25%
CPUWeight=25

# Memory: lightweight health status polling
MemoryMax=128M
MemoryHigh=96M

# PID: single Python script
TasksMax=32
