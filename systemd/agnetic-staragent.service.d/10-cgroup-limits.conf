[Service]
# ── StarAgent telemetry — lightweight Rust binary (H-012) ──────
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes

# CPU: hard cap 25%; weight 50 (half default)
CPUQuota=25%
CPUWeight=50

# Memory: 128MiB hard cap, throttle at 96MiB
MemoryMax=128M
MemoryHigh=96M

# PID: Rust binary, single process + small thread pool
TasksMax=64
