[Service]
# ── Dashboard server — Web UI (:8788) (H-012) ─────────────────
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes

# CPU: moderate cap; dashboard is mostly idle between requests
CPUQuota=25%
CPUWeight=50

# Memory: template rendering can buffer responses; 256MiB hard
MemoryMax=256M
MemoryHigh=192M

# PID: Python w/ threads
TasksMax=128
