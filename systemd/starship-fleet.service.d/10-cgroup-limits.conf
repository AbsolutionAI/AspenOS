[Service]
# ── Fleet manager — agent lifecycle orchestration (H-012) ─────
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes
IOAccounting=yes

# CPU: fleet orchestrates multiple agent spawns; moderate steady-state
CPUQuota=50%
CPUWeight=100

# Memory: agent manager state; hard cap 512MiB
MemoryMax=512M
MemoryHigh=384M

# PID: manages agent subprocess state
TasksMax=128
