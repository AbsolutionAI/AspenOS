[Service]
# ── NATS server — message bus (H-012) ─────────────────────────
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes
IOAccounting=yes

# CPU: message routing is latency-critical; one-core equivalent
CPUQuota=100%
CPUWeight=200

# Memory: per-connection buffers + JetStream storage; hard at 256MiB
MemoryMax=256M
MemoryHigh=192M

# PID: connection-handler goroutines; higher than agents
TasksMax=256
