[Service]
# ── Per-agent CPU/memory/PID cgroup limits (H-012) ──────────────
CPUAccounting=yes
MemoryAccounting=yes
TasksAccounting=yes
IOAccounting=yes

# CPU: hard cap at 50% of one core; relative weight 100 at contention
CPUQuota=50%
CPUWeight=100

# Memory: hard limit 512MiB; soft throttle starts at 384MiB
MemoryMax=512M
MemoryHigh=384M

# PID count: bound fork activity from Python subprocess calls
TasksMax=128
